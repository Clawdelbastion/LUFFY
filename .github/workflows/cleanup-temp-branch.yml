name: Cleanup temp branch

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/cleanup-temp-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Delete temporary branch
        run: git push origin --delete tmp-write-test || true
